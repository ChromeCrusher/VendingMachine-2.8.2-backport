dependencies {
    implementation("com.github.GTNewHorizons:NotEnoughItems:2.8.40-GTNH:dev")
    implementation("com.github.GTNewHorizons:GTNHLib:0.7.10:dev")
    implementation("com.github.GTNewHorizons:BetterQuesting:3.7.15-GTNH:dev")

    implementation("com.github.GTNewHorizons:ModularUI2:2.2.18-1.7.10:dev")
    implementation("com.github.GTNewHorizons:StructureLib:1.4.23:dev")
    implementation("com.github.GTNewHorizons:GT5-Unofficial:5.09.51.481:dev")
}

// deps may transitively add Baubles, so we replace it
project.getConfigurations().all { c ->
    final DependencySubstitutions ds = c.getResolutionStrategy().getDependencySubstitution()
    ds.substitute(ds.module("com.github.GTNewHorizons:Baubles"))
        .using(ds.module("com.github.GTNewHorizons:Baubles-Expanded:2.2.6-GTNH"))
        .withClassifier("dev")
        .because("Baubles-Expanded replaces Baubles")
}

// hard-pin 2.8.2-era versions so newer transitives cannot override them
configurations.all {
    resolutionStrategy {
        force "com.github.GTNewHorizons:NotEnoughItems:2.8.40-GTNH:dev"
        force "com.github.GTNewHorizons:GTNHLib:0.7.10:dev"
        force "com.github.GTNewHorizons:BetterQuesting:3.7.15-GTNH:dev"
        force "com.github.GTNewHorizons:ModularUI2:2.2.18-1.7.10:dev"
        force "com.github.GTNewHorizons:StructureLib:1.4.23:dev"
        force "com.github.GTNewHorizons:GT5-Unofficial:5.09.51.481:dev"
    }
}
